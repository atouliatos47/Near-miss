<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#243547" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Clamason Observation Logger</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="header-inner">
            <img src="/icons/icon-192.png" alt="Clamason" class="logo" onerror="this.style.display='none'" />
            <h1>Observation Logger</h1>
            <p class="subtitle">Near Miss &amp; Safety Observations</p>
        </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>

        <!-- SUCCESS SCREEN -->
        <div id="successScreen" class="hidden">
            <div class="success-card">
                <div class="success-icon">✅</div>
                <h2>Report Submitted!</h2>
                <p>Thank you for helping keep Clamason safe.</p>
                <button id="submitAnother" class="btn-primary">Submit Another</button>
            </div>
        </div>

        <!-- FORM -->
        <form id="obsForm" enctype="multipart/form-data" novalidate>

            <!-- Type -->
            <div class="form-group">
                <label>Report Type <span class="required">*</span></label>
                <div class="type-grid">
                    <label class="type-card near-miss">
                        <input type="radio" name="type" value="Near Miss" required />
                        <span class="type-icon">⚠️</span>
                        <span class="type-label">Near Miss</span>
                    </label>
                    <label class="type-card observation">
                        <input type="radio" name="type" value="Observation" required />
                        <span class="type-icon">👁️</span>
                        <span class="type-label">Observation</span>
                    </label>
                </div>
                <span class="error-msg" id="typeError">Please select a report type</span>
            </div>

            <!-- Department -->
            <div class="form-group">
                <label for="department">Department <span class="required">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- Select Department --</option>
                    <option value="Press Shop">Press Shop</option>
                    <option value="Assembly">Assembly</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Quality">Quality</option>
                    <option value="Stores">Stores</option>
                    <option value="Despatch">Despatch</option>
                    <option value="Office">Office</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="deptError">Please select a department</span>
            </div>

            <!-- Reported By -->
            <div class="form-group">
                <label for="reported_by">Your Name <span class="optional">(optional — anonymous if blank)</span></label>
                <input type="text" id="reported_by" name="reported_by" placeholder="e.g. John Smith" />
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description <span class="required">*</span></label>
                <textarea id="description" name="description" rows="4"
                    placeholder="Describe what happened or what you observed..." required></textarea>
                <span class="error-msg" id="descError">Please describe the observation</span>
            </div>

            <!-- Immediate Action -->
            <div class="form-group">
                <label for="immediate_action">Immediate Action Taken <span class="optional">(optional)</span></label>
                <textarea id="immediate_action" name="immediate_action" rows="3"
                    placeholder="Describe any immediate steps taken..."></textarea>
            </div>

            <!-- Photo -->
            <div class="form-group">
                <label>Photo <span class="optional">(optional)</span></label>
                <label class="photo-upload" for="photo">
                    <span class="photo-icon">📷</span>
                    <span id="photoLabel">Tap to take a photo or choose from gallery</span>
                    <input type="file" id="photo" name="photo" accept="image/*" capture="environment" />
                </label>
                <div id="photoPreview" class="hidden">
                    <img id="previewImg" src="" alt="Preview" />
                    <button type="button" id="removePhoto" class="btn-remove">✕ Remove</button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="submitText">Submit Report</span>
                <span id="submitSpinner" class="hidden">Submitting...</span>
            </button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>Clamason Industries — Safety First</p>
    </footer>

    <script src="/app.js"></script>
</body>

</html>
